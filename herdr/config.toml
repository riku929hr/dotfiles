onboarding = false

[theme]
name = "one-dark"
auto_switch = false

# herdr には tmux の is_vim 相当が無く、直接キーは nvim のキーを奪うため prefix 配下のみにする
[keys]
prefix = "ctrl+q"
detach = "prefix+d"
split_vertical = "prefix+|"
split_horizontal = ["prefix+minus", "prefix+backslash"]
last_pane = "prefix+semicolon"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
